services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: vision-edge
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8001
      DEVICE_MODE: ${DEVICE_MODE:-server}
      DASHBOARD_API_ENABLED: ${DASHBOARD_API_ENABLED:-false}
    volumes:
      - ./alerts:/app/alerts
      - ./models:/app/models:ro
      - ./harness_runs:/app/harness_runs
      - ./roboflow_outputs:/app/roboflow_outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # For a USB webcam, uncomment on Linux hosts and set IP_CAMERA_URL=0:
    # devices:
    #   - "/dev/video0:/dev/video0"
    # For RTSP/IP cameras, no device mapping is needed; set IP_CAMERA_URL to the stream URL.
