version: '3.8'

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: vision-edge
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
    volumes:
      - ./alerts:/app/alerts
      - ./models:/app/models
    restart: unless-stopped

